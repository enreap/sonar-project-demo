name: Java CI with Maven and SonarQube

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-scan:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the source code
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of SonarQube analysis

    # Step 2: Set up Java Development Kit (JDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Change to '11' or '21' depending on your project requirements
        distribution: 'temurin'
        cache: 'maven'     # Caches dependencies to speed up future workflow runs

    # Step 3: Cache SonarQube packages to speed up analysis
    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # Step 4: Build, Run Tests, and Execute SonarQube Scan
    # The Jacoco plugin should be configured in your pom.xml to generate code coverage XML report
    - name: Build and Analyze with SonarQube
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: mvn -B verify sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.projectKey=sonar-project-demo -Dsonar.projectName="sonar.project.demo"        
